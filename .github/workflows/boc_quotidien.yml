name: BOC quotidien

on:
  schedule:
    # 18h00 UTC, du lundi au vendredi. La BRVM publie le bulletin en fin de séance ;
    # l'horaire des exécutions planifiées GitHub dérive souvent de plusieurs minutes.
    - cron: '0 18 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: donnees-brvm
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install requests beautifulsoup4

      - name: Vérifier la compatibilité Python 3.11 des scripts
        run: python pipeline/lint_fstring.py pipeline/*.py

      - name: Collecter le bulletin du jour
        run: python pipeline/collecte_boc.py

      - name: Publier sur main
        run: |
          SEANCE=$(python -c "import json;print(json.load(open('donnees/boc.json'))['seance'])")
          bash pipeline/publier.sh "donnees/boc.json" "BOC séance du $SEANCE"

      - name: Conserver la trace en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-boc
          path: donnees/
          if-no-files-found: ignore
