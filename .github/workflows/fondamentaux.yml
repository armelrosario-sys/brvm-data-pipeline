name: Fondamentaux BRVM
on:
  workflow_dispatch:
jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python collecte_fondamentaux.py
      - uses: actions/upload-artifact@v7
        with:
          name: fondamentaux-brvm
          path: fondamentaux_brvm.csv
