name: Sikafinance hebdomadaire

on:
  schedule:
    # samedi 06h00 UTC : marché fermé, séance de la semaine close
    - cron: '0 6 * * 6'
  workflow_dispatch:
    inputs:
      symboles:
        description: "Symboles à collecter, séparés par un espace (vide = les 47)"
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: donnees-brvm
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Collecter performances et fondamentaux
        run: python pipeline/collecte_sikafinance.py ${{ github.event.inputs.symboles }}

      - name: Reconstruire le fichier de données
        run: python pipeline/construit_donnees.py

      - name: Publier si le contenu a changé
        run: |
          git config user.name  "pipeline-brvm"
          git config user.email "actions@users.noreply.github.com"
          git add donnees/sikafinance.json docs/data_brvm.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Sikafinance — relevé du $(date -u +%F)"
            git push
          fi

      - name: Conserver la trace en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-sikafinance
          path: donnees/
          if-no-files-found: ignore
