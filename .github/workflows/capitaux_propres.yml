name: Capitaux propres (notations)

on:
  schedule:
    # 5 de chaque mois, 05h00 UTC. Les fiches de notation ne bougent qu'une à
    # deux fois par an et par émetteur : une passe mensuelle suffit largement.
    - cron: '0 5 5 * *'
  workflow_dispatch:
    inputs:
      mois:
        description: "Ancienneté maximale du rapport retenu, en mois"
        required: false
        default: '18'
      test_seul:
        description: "Rejouer l'analyseur seul, sans rien télécharger"
        type: choice
        required: true
        default: non
        options: [non, oui]
      diagnostic:
        description: "Conserver le texte des rapports non exploités"
        type: choice
        required: true
        default: oui
        options: [oui, non]

permissions:
  contents: write

concurrency:
  group: donnees-brvm
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install requests

      - name: Vérifier la compatibilité Python 3.11 des scripts
        run: python pipeline/lint_fstring.py pipeline/*.py

      - name: Vérifier l'index des notations
        run: |
          if [ ! -f collecte/notations_financieres.csv ]; then
            echo "::error::collecte/notations_financieres.csv absent — lancer d'abord P12."
            exit 1
          fi
          echo "$(( $(wc -l < collecte/notations_financieres.csv) - 1 )) annonces indexées"

      - name: Rejouer l'analyseur seul
        if: ${{ github.event.inputs.test_seul == 'oui' }}
        run: python pipeline/capitaux_propres.py --test

      - name: Extraire les capitaux propres
        if: ${{ github.event.inputs.test_seul != 'oui' }}
        run: |
          python pipeline/capitaux_propres.py \
            --mois ${{ github.event.inputs.mois || 18 }} \
            ${{ github.event.inputs.diagnostic == 'oui' && '--diagnostic' || '' }}

      - name: Publier sur main
        if: ${{ github.event.inputs.test_seul != 'oui' }}
        run: |
          bash pipeline/publier.sh "donnees/fonds_propres.csv" \
            "Capitaux propres — relevé du $(date -u +%F)"

      - name: Conserver la trace en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-capitaux-propres
          path: donnees/
          if-no-files-found: ignore
