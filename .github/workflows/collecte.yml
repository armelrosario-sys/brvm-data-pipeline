name: P2b - Collecte selective brvm.org
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1,4"   # lundi et jeudi 03h00 UTC

permissions:
  contents: write

# Ajout 06/08/2026 : sans groupe de concurrence, deux executions simultanees
# (declenchement manuel pendant un run programme, ou relance) se disputent
# le push et l'une des deux est annulee ou echoue. cancel-in-progress: false
# fait ATTENDRE la seconde plutot que de la tuer : aucune collecte perdue.
concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Collecte
        run: python collecte/collecteur.py
      - name: Publication vers les Releases
        if: always()
        run: |
          if [ -f a_uploader.txt ]; then
            cut -f1 a_uploader.txt | sort -u | while read tag; do
              if ! gh release view "$tag" >/dev/null 2>&1; then
                gh release create "$tag" --title "$tag" \
                  --notes "Archives collectees automatiquement (source: brvm.org)"
                sleep 5
              fi
              grep -P "^$tag\t" a_uploader.txt | cut -f2 | while read f; do
                gh release upload "$tag" "$f" --clobber || \
                  echo "ECHEC upload: $f (tag $tag)" >> echecs_upload.txt
              done
            done
          fi
      - name: Verification post-publication
        if: always()
        run: |
          python3 collecte/verifier_releases.py
      - name: Commit du manifeste et de l'etat
        if: always()
        run: |
          git config user.name "robot-collecte"
          git config user.email "robot@users.noreply.github.com"
          # Correctif 06/08/2026 : a_uploader.txt est SUIVI par git et REECRIT a
          # chaque run par collecteur.py (mode "a"), mais n'etait pas ajoute au
          # commit. Il restait donc en modification non indexee, et le
          # "git pull --rebase" echouait juste apres un commit reussi :
          #   "error: cannot pull with rebase: You have unstaged changes."
          # Le travail de collecte etait perdu alors qu'il avait abouti.
          # Double protection : on ajoute les fichiers produits, ET le pull
          # utilise --autostash (voir ci-dessous) pour tout residu imprevu.
          # Correctif 08/10/2026 (cycle 23, chantier C35) : ce "git add" a plusieurs
          # chemins perdait TOUT le manifeste a chaque run sain. echecs_upload.txt
          # n'est cree que lorsqu'un upload ECHOUE -- il n'existe donc pas dans le
          # cas normal. Or git add est ATOMIQUE sur ses chemins : un seul absent et
          # il n'indexe RIEN et sort en 128, que le "|| true" avalait. Journal du
          # run 26 du 05/10/2026, verbatim :
          #   fatal: pathspec 'echecs_upload.txt' did not match any files
          #   Changes not staged for commit:  modified: MANIFESTE.csv ...
          #   rien a committer / Everything up-to-date
          # Les 3 PDF collectes ce jour-la sont bien arrives dans la Release ; leurs
          # lignes de manifeste ont ete jetees. C'est la cause unique de l'arret des
          # deux releves de collecte au 2026-07-24 (C35) : les backfills parcourent
          # MANIFESTE.csv, donc ils etaient AVEUGLES a 20 bulletins deja archives.
          # Plus la collecte se portait bien, plus surement elle perdait sa trace.
          # Un "git add" par chemin, conditionne a son existence : la convention
          # deja en place dans collecte_quotidienne.yml. La section 37 de
          # moteur/tester_donnees.py ferme la famille pour tous les workflows.
          for f in MANIFESTE.csv collecte/etat_rapports.json \
                   collecte/a_reteleverser.json a_uploader.txt echecs_upload.txt; do
            [ -e "$f" ] && git add "$f"
          done
          git commit -m "Collecte $(date -u +%F)" || echo "rien a committer"
          git pull --rebase --autostash origin main
          git push
