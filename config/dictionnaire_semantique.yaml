# Dictionnaire sémantique — v0.1 (libellés -> champs canoniques)
# Enrichi à chaque session d'arbitrage. Libellé absent = QUARANTAINE.
version: "0.1"

champs_canoniques:
  resultat_net:
    syscohada: ["Résultat net", "Résultat net de l'exercice", "Bénéfice net",
                "RESULTAT DE L'EXERCICE", "Resultat net de l'exercice"]  # variantes reelles observees (OCR SDSC 2024)
    bancaire_umoa: ["Résultat net", "Résultat de l'exercice"]
  total_actif:
    syscohada: ["TOTAL ACTIF", "Total général actif"]
    bancaire_umoa: ["TOTAL ACTIF", "Total de l'actif"]
  total_passif:
    syscohada: ["TOTAL PASSIF", "Total général passif"]
    bancaire_umoa: ["TOTAL PASSIF", "Total du passif"]
  capitaux_propres:
    syscohada: ["Capitaux propres", "Total capitaux propres et ressources assimilées",
                "Situation nette"]  # variante reelle (OCR SDSC 2024) -- NB : Situation nette
                                     # exclut parfois "Autres capitaux propres", a additionner
                                     # separement si cette ligne existe aussi (cf. extracteur)
    bancaire_umoa: ["Capitaux propres", "Fonds propres"]
  dettes_financieres:
    syscohada: ["Dettes financières", "Emprunts et dettes financières diverses"]
    bancaire_umoa: ["Dettes financières"]
  autres_capitaux_propres:
    syscohada: ["Autres capitaux propres"]
    bancaire_umoa: []
  chiffre_affaires:
    syscohada: ["Chiffre d'affaires", "Chiffre d'affaires net"]
    bancaire_umoa: ["Produit net bancaire", "PNB"]

  # --- Ajout 04/09/2026 : detection des resultats non operationnels ---
  # Motif : le profilage d'AGL CI reposait sur une croissance du RESULTAT NET
  # de +14,8 %/an, alors qu'en 2024 ce resultat etait a 96 % d'origine
  # FINANCIERE (resultat d'exploitation 941,675 M pour un resultat financier de
  # 20 870,055 M). L'exercice 2025 a fait tomber le resultat net de 96 %.
  # Le champ resultat_activites_ordinaires (RAO) NE SUFFIT PAS a detecter ce
  # cas : le RAO INCLUT le resultat financier (21 811,730 M pour AGL CI 2024).
  # Seul le resultat d'EXPLOITATION isole la performance du metier.
  resultat_exploitation:
    syscohada: ["RESULTAT D'EXPLOITATION", "Résultat d'exploitation",
                "RESULTAT D EXPLOITATION", "Resultat d'exploitation"]
    # Pour une banque, l'equivalent fonctionnel est le resultat brut
    # d'exploitation ou le resultat d'exploitation apres cout du risque.
    bancaire_umoa: ["Résultat brut d'exploitation", "Resultat brut d'exploitation",
                    "Résultat d'exploitation", "RESULTAT BRUT D'EXPLOITATION"]
  resultat_financier:
    syscohada: ["RESULTAT FINANCIER", "Résultat financier", "Resultat financier"]
    bancaire_umoa: []
